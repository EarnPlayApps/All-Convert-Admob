name: All Convert - Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore All Convert HTML asset
        working-directory: allconvert_native
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat .build/index.gz.b64.aa .build/index.gz.b64.ab .build/index.gz.b64.ac .build/index.gz.b64.ad > /tmp/index.gz.b64
          tr -cd 'A-Za-z0-9+/=' < /tmp/index.gz.b64 > /tmp/index.clean.b64
          base64 --ignore-garbage -d /tmp/index.clean.b64 > /tmp/index.gz
          gunzip -c /tmp/index.gz > app/src/main/assets/index.html
          sed -i 's/ca-app-pub-9940728659432865~7835018675/ca-app-pub-9940728659432865~2706136459/g; s/ca-app-pub-9940728659432865\/7572128943/ca-app-pub-9940728659432865\/6234492932/g' app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          ACTUAL=$(wc -c < app/src/main/assets/index.html)
          test "$ACTUAL" -eq 31823
          grep -q 'ALL CONVERT ADMOB LIVE BANNER' app/src/main/assets/index.html
          grep -q 'ca-app-pub-9940728659432865~2706136459' app/src/main/assets/index.html
          grep -q 'ca-app-pub-9940728659432865/6234492932' app/src/main/assets/index.html
          ! grep -q 'ca-app-pub-9940728659432865/7572128943' app/src/main/assets/index.html
          grep -q 'ca-app-pub-9940728659432865~2706136459' app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/6234492932' app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/4102978608' app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/6537570257' app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/5224488586' app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/1006961841' app/src/main/java/com/allconvert/app/MainActivity.java
          echo "HTML asset and native AdMob IDs verified: $ACTUAL bytes"

      - name: Setup Java 17 (Android build JDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.14.6 (compatible with AGP 8.7.3)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.6'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | head -80

      - name: Build release APK (optimized)
        working-directory: allconvert_native
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK output
        working-directory: allconvert_native
        run: |
          test -s app/build/outputs/apk/release/*.apk
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: All-Convert-optimized-APK
          path: allconvert_native/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

# Native file actions repaired on 2026-10-12

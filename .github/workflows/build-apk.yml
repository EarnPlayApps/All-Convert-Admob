name: All Convert - Build APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, fix/app-open-cooldown-5min ]

concurrency:
  group: all-convert-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore All Convert HTML asset
        working-directory: allconvert_native
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat .build/index.gz.b64.aa .build/index.gz.b64.ab .build/index.gz.b64.ac .build/index.gz.b64.ad > /tmp/index.gz.b64
          tr -cd 'A-Za-z0-9+/=' < /tmp/index.gz.b64 > /tmp/index.clean.b64
          base64 --ignore-garbage -d /tmp/index.clean.b64 > /tmp/index.gz
          gunzip -c /tmp/index.gz > app/src/main/assets/index.html
          sed -i 's/ca-app-pub-9940728659432865~7835018675/ca-app-pub-9940728659432865~2706136459/g; s/ca-app-pub-9940728659432865\/7572128943/ca-app-pub-9940728659432865\/6234492932/g' app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/privacy_policy.html
          test -s app/src/main/assets/terms.html
          grep -q "Dasar Privasi All Convert" app/src/main/assets/privacy_policy.html
          grep -q "Terma Penggunaan All Convert" app/src/main/assets/terms.html
          grep -q "showLegalPage" app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q "settingsEntry" app/src/main/res/layout/activity_main.xml
          grep -q "historyEntry" app/src/main/res/layout/activity_main.xml
          grep -q "allconvert_pro_monthly" app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q "recordHistory" app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q "recordConverted" app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q "showHistoryDialog" app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q "allconvert-history" app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q "SUPABASE_PUBLISHABLE_KEY" app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q "com.android.billingclient:billing:6.2.1" app/build.gradle
          ACTUAL=$(wc -c < app/src/main/assets/index.html)
          test "$ACTUAL" -ge 30000
          sed -i 's|#admobBanner{width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;overflow:hidden;border-radius:12px;background:rgba(255,255,255,.025)}|#admobBanner{display:none!important;min-height:0!important;margin:0!important}|' app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/index.html")
          h = p.read_text(encoding="utf-8")
          old = '<label class="drop" id="drop" for="fileInput"><div class="drop-icon">📁</div><div class="drop-title">Tap untuk pilih fail</div><div class="drop-sub">atau drag &amp; drop • maksimum 100 MB</div><input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp,.avif,.bmp,.gif,.docx,.txt,.md,.html,.csv,.json,.pdf,.zip,*/*"></label>'
          new = '<div class="drop" id="drop"><div class="drop-icon">📁</div><div class="drop-title">Pilih fail untuk mula</div><div class="drop-sub">atau drag &amp; drop • maksimum 100 MB</div><button type="button" class="pick-file-btn" id="pickFileBtn">Tap untuk pilih fail</button><input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp,.avif,.bmp,.gif,.docx,.txt,.md,.html,.csv,.json,.pdf,.zip,*/*" style="display:none"></div>'
          if old not in h:
              raise SystemExit("FAIL: original file picker markup not found")
          h = h.replace(old, new, 1)
          css_anchor = '.drop{margin-top:18px;'
          if css_anchor not in h:
              raise SystemExit("FAIL: drop CSS anchor not found")
          h = h.replace(css_anchor, '.drop{position:relative;margin-top:18px;', 1)
          p.write_text(h, encoding="utf-8")
          print("File picker isolated to #pickFileBtn")
          history_anchor = 'resultBlob=b;resultName=baseName(currentFile.name)+"."+to;'
          if history_anchor not in h:
              raise SystemExit("FAIL: successful conversion History anchor not found")
          history_hook = 'resultBlob=b;resultName=baseName(currentFile.name)+"."+to;if(window.AndroidBridge?.conversionCompleted)window.AndroidBridge.conversionCompleted();if(window.AndroidBridge?.recordConverted){if(b.size<=52428800){try{const reader=new FileReader();const encoded=await new Promise((resolve,reject)=>{reader.onload=()=>resolve(String(reader.result).split(",")[1]||"");reader.onerror=()=>reject(reader.error);reader.readAsDataURL(b)});window.AndroidBridge.recordConverted(resultName,b.type||"application/octet-stream",encoded);window.__allConvertHistoryLarge=false}catch(historyError){console.warn("History local save failed",historyError)}}else{window.__allConvertHistoryLarge=true}}'
          h = h.replace(history_anchor, history_hook, 1)
          toast_anchor = 'showToast("✅ Conversion berjaya!",resultName+" sudah siap.");'
          if toast_anchor not in h:
              raise SystemExit("FAIL: conversion success toast anchor not found")
          h = h.replace(toast_anchor, 'showToast("✅ Conversion berjaya!",resultName+" sudah siap."+(window.__allConvertHistoryLarge?" Fail lebih 50 MB tidak masuk History automatik; sila simpan manual.":""));window.__allConvertHistoryLarge=false;', 1)
          if 'recordConverted' not in h:
              raise SystemExit("FAIL: automatic History hook was not inserted")
          # Connect result actions to Android's native file APIs inside the WebView.
          # Browser blob downloads and showSaveFilePicker are not reliable in Android WebView.
          native_bridge = r'''<script>(function(){
          const browserDownload=window.downloadResultFile,browserSave=window.saveToDevice,browserShare=window.shareResult,browserOpen=window.openResultFile;
          const pick=document.getElementById('pickFileBtn'),input=document.getElementById('fileInput');if(pick&&input)pick.addEventListener('click',()=>input.click());
          function send(method,blob,name){return new Promise((resolve,reject)=>{try{if(!window.AndroidBridge||typeof window.AndroidBridge[method]!=="function")return reject(new Error("Native file bridge unavailable"));const reader=new FileReader();reader.onerror=()=>reject(reader.error||new Error("Fail tidak dapat dibaca"));reader.onload=()=>{try{const encoded=String(reader.result).split(",")[1]||"";if(!encoded)throw new Error("Data fail kosong");window.AndroidBridge[method](name,blob.type||"application/octet-stream",encoded);resolve()}catch(e){reject(e)}};reader.readAsDataURL(blob)}catch(e){reject(e)}})}
          window.downloadResultFile=function(){if(!resultBlob)return window.showToast("Tiada fail","Buat conversion dahulu.");if(!window.AndroidBridge)return browserDownload();send("download",resultBlob,resultName).then(()=>{window.setStatus("Fail dihantar ke folder Download. ✓","ok");window.showToast("Download","Fail disimpan dalam Download/All Convert.")}).catch(e=>{console.error(e);window.showToast("Download gagal",e.message||"Cuba lagi.")})};
          window.saveToDevice=async function(){if(!resultBlob)return window.showToast("Tiada fail","Buat conversion dahulu.");if(!window.AndroidBridge)return browserSave();try{await send("saveAs",resultBlob,resultName);window.setStatus("Pilih lokasi untuk simpan fail.","ok")}catch(e){console.error(e);window.showToast("Simpanan gagal",e.message||"Cuba Download.")}};
          window.shareResult=function(){if(!resultBlob)return window.showToast("Tiada fail","Buat conversion dahulu.");if(!window.AndroidBridge)return browserShare();send("share",resultBlob,resultName).then(()=>{window.setStatus("Fail sedia dikongsi. ✓","ok")}).catch(e=>{console.error(e);window.showToast("Share gagal",e.message||"Cuba Download.")})};
          window.openResultFile=function(){if(!resultBlob)return window.showToast("Tiada fail","Buat conversion dahulu.");if(!window.AndroidBridge)return browserOpen();send("openWith",resultBlob,resultName).then(()=>{window.setStatus("Membuka fail dengan aplikasi peranti…","ok")}).catch(e=>{console.error(e);window.showToast("Open With gagal",e.message||"Cuba Download.")})};
          })();</script>'''
          if 'window.__allConvertNativeBridgeInstalled' not in h:
              close = h.rfind('</body>')
              if close < 0:
                  raise SystemExit("FAIL: HTML body closing tag not found for native file bridge")
              native_bridge = native_bridge.replace('(function(){','(function(){window.__allConvertNativeBridgeInstalled=true;',1)
              h = h[:close] + native_bridge + '\n' + h[close:]
          # Repair promotion script placement: it was accidentally inserted inside
          # the DOCX-to-HTML template literal, truncating the main application script.
          promo_script = """<script>(function(){const endpoint='https://hckvehpkzwyerkwpdvlz.supabase.co/functions/v1/allconvert-promotions';const publicKey='sb_publishable_W1nZcXZSwu3oeKA35iQeJA_AU579wju';const box=document.getElementById('promoAnnouncement');if(!box)return;const $=id=>document.getElementById(id);const promoBtn=$('promoPlansBtn');if(promoBtn)promoBtn.addEventListener('click',()=>{if(window.AndroidBridge&&window.AndroidBridge.openPro)window.AndroidBridge.openPro();else document.querySelector('[data-plan],#proPlans,.pro-plans')?.scrollIntoView({behavior:'smooth',block:'center'})});const locale=(()=>{try{const p=localStorage.getItem('allconvert_language_preference');return p&&p!=='auto'?p:(navigator.language||'en').split('-')[0]}catch(e){return(navigator.language||'en').split('-')[0]}})();const fmt=value=>new Intl.DateTimeFormat(locale,{day:'numeric',month:'short',year:'numeric'}).format(new Date(value));const once=(key)=>{try{if(localStorage.getItem(key))return false;localStorage.setItem(key,'1');return true}catch(e){return true}};const show=(eyebrow,title,message,dates)=>{$('promoEyebrow').textContent=eyebrow;$('promoTitle').textContent=title;$('promoMessage').textContent=message;$('promoDates').textContent=dates;box.style.display='block'};fetch(endpoint+'?locale='+encodeURIComponent(locale),{headers:{apikey:publicKey},cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('promo unavailable');return r.json()}).then(data=>{const active=data.active||null,next=data.next||null,previous=(()=>{try{return localStorage.getItem('ac_last_active_promo')||''}catch(e){return ''}})();if(active){const id=String(active.id||active.campaign_key);const startKey='ac_promo_'+id+'_start';const endingKey='ac_promo_'+id+'_ending';let notice='PROMO SEDANG BERLANGSUNG';if(once(startKey))notice='PROMO BERMULA';else if(data.ending_soon&&once(endingKey))notice='PERINGATAN: PROMO HAMPIR TAMAT';else if(data.ending_soon)notice='PROMO HAMPIR TAMAT';show(notice,active.title||'Pengumuman All Convert',active.message||'Semak tawaran terkini All Convert Pro.',(active.promo_label?active.promo_label+' · ':'')+'Sah: '+fmt(active.starts_at)+' – '+fmt(active.ends_at)+'');try{localStorage.setItem('ac_last_active_promo',id)}catch(e){}return}if(data.ended){const endedId=String(data.ended.id||data.ended.campaign_key);if(once('ac_promo_'+endedId+'_ended')){show('PROMO TELAH TAMAT','Terima kasih kerana bersama All Convert','Tawaran promosi ini telah tamat. Semak pengumuman untuk promosi terkini.','Tamat: '+fmt(data.ended.ends_at)+'');return}}if(previous){if(once('ac_promo_'+previous+'_ended')){show('PROMO TELAH TAMAT','Terima kasih kerana bersama All Convert','Tawaran sebelum ini telah tamat. Semak pengumuman untuk promosi terkini.','');try{localStorage.removeItem('ac_last_active_promo')}catch(e){}return}try{localStorage.removeItem('ac_last_active_promo')}catch(e){}}if(next){show('PROMO AKAN DATANG',next.title||'Pengumuman All Convert',next.message||'Tawaran baharu akan bermula tidak lama lagi.',(next.promo_label?next.promo_label+' · ':'')+'Mula: '+fmt(next.starts_at)+' · Waktu Malaysia');return}const fallback=data.fallback||{title:'All Convert sentiasa bersama anda',message:'Semak halaman Pro untuk melihat tawaran dan manfaat terkini.'};show('PENGUMUMAN ALL CONVERT',fallback.title||'All Convert sentiasa bersama anda',fallback.message||'Semak halaman Pro untuk melihat tawaran dan manfaat terkini.','Promotion dates are shown in your local time.')}).catch(()=>{show('PENGUMUMAN ALL CONVERT','All Convert sentiasa bersama anda','Promosi belum dapat dimuatkan. Sila cuba semula apabila internet tersedia.','')})})();</script>"""
          endpoint_marker = "const endpoint='https://hckvehpkzwyerkwpdvlz.supabase.co/functions/v1/allconvert-promotions';"
          endpoint_pos = h.find(endpoint_marker)
          if endpoint_pos >= 0:
              bad_start = h.rfind('<script>', 0, endpoint_pos)
              bad_end = h.find('</script>', endpoint_pos)
              if bad_start < 0 or bad_end < 0:
                  raise SystemExit("FAIL: misplaced promotion script could not be isolated")
              h = h[:bad_start] + h[bad_end + len('</script>'):]
          # Insert the announcement into the real document body, never by searching
          # for its id: that id may also occur inside the DOCX HTML template literal
          # in the main JavaScript, where inserting a <script> closes the app script.
          body_match = __import__('re').search(r'<body\b[^>]*>', h, flags=__import__('re').I)
          if not body_match:
              raise SystemExit("FAIL: HTML body insertion point not found")
          promo_card = '<section id="promoAnnouncement" class="ac-promo" style="display:none"><div class="ac-promo-top"><div class="ac-promo-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.2 6.1L20 10l-5.8 2.1L12 18l-2.2-5.9L4 10l5.8-1.9L12 2Zm7 12 1.1 2.9L23 18l-2.9 1.1L19 22l-1.1-2.9L15 18l2.9-1.1L19 14Z" fill="currentColor"/></svg></div><div class="ac-promo-heading"><span id="promoEyebrow" class="ac-promo-kicker">PENGUMUMAN RASMI</span><span class="ac-promo-brand">ALL CONVERT PRO</span></div><span class="ac-promo-live">TAWARAN</span></div><div class="ac-promo-content"><h2 id="promoTitle">Tawaran khas All Convert Pro</h2><p id="promoMessage"></p><div class="ac-promo-footer"><span id="promoDates" class="ac-promo-dates"></span><button type="button" id="promoPlansBtn" class="ac-promo-cta">Lihat pelan Pro <span aria-hidden="true">›</span></button></div></div></section>\n'

          promo_css = r"""<style>
          .ac-promo{box-sizing:border-box;position:relative;isolation:isolate;width:calc(100% - 28px);max-width:760px;margin:18px auto 22px;padding:1px;border-radius:27px;overflow:hidden;background:linear-gradient(125deg,#22cfee 0%,#7768ff 42%,#22cfee 75%,#3b4c78 100%);box-shadow:0 18px 48px #0008,0 0 28px #7768ff24;color:#fff;font-family:inherit}
          .ac-promo:before{content:'';position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse at 12% 0%,#7768ff66,transparent 43%),radial-gradient(ellipse at 100% 100%,#22cfee44,transparent 45%)}
          .ac-promo-top{position:relative;display:flex;align-items:center;gap:12px;padding:16px 18px;background:linear-gradient(112deg,#201c55 0%,#111b3d 58%,#0b3042 100%);border-radius:26px 26px 0 0}
          .ac-promo-mark{width:46px;height:46px;flex:0 0 46px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#9387ff 0%,#7768ff 48%,#22cfee 100%);color:#fff;box-shadow:0 7px 22px #7768ff66,inset 0 1px 0 #ffffff66}
          .ac-promo-mark svg{width:27px;height:27px;filter:drop-shadow(0 0 8px #22cfee99)}
          .ac-promo-heading{display:flex;flex:1;min-width:0;flex-direction:column;gap:4px}
          .ac-promo-kicker{font-size:9px;font-weight:950;letter-spacing:.16em;color:#70eaff}
          .ac-promo-brand{font-size:13px;font-weight:900;letter-spacing:.09em;color:#fff}
          .ac-promo-live{padding:7px 10px;border:1px solid #7d73ff88;border-radius:999px;background:linear-gradient(120deg,#7768ff35,#22cfee20);color:#dceaff;font-size:9px;font-weight:950;letter-spacing:.09em;box-shadow:inset 0 1px 0 #ffffff18}
          .ac-promo-content{position:relative;padding:20px 20px 18px;background:linear-gradient(145deg,#111b39 0%,#0c1224 65%,#0b2839 120%)}
          .ac-promo-content:before{content:'';position:absolute;right:-34px;top:-56px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#7768ff32 0%,#22cfee12 38%,transparent 72%);pointer-events:none}
          .ac-promo-content:after{content:'✦  ✧  ✦';position:absolute;right:19px;top:14px;color:#a99fff9c;font-size:20px;letter-spacing:9px;text-shadow:0 0 16px #7768ff88;pointer-events:none}
          .ac-promo-content h2{position:relative;max-width:90%;margin:0 0 10px;color:#fff;font-size:clamp(20px,4.5vw,25px);line-height:1.22;font-weight:950;letter-spacing:-.025em;text-shadow:0 3px 20px #7768ff38}
          .ac-promo-content p{position:relative;max-width:95%;margin:0;color:#c1cce2;font-size:13px;line-height:1.7}
          .ac-promo-footer{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid #ffffff16}
          .ac-promo-dates{display:inline-flex;align-items:center;min-height:32px;padding:6px 11px;border:1px solid #53618b88;border-radius:11px;background:linear-gradient(120deg,#1b2448,#122b3c);color:#d2def3;font-size:10px;font-weight:800;box-shadow:inset 0 1px 0 #ffffff10}
          .ac-promo-cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px;padding:0 18px;border:1px solid #ffffff55;border-radius:13px;background:linear-gradient(110deg,#8170ff 0%,#6b63f2 42%,#18bfe2 100%);box-shadow:0 8px 22px #4b62ff55,inset 0 1px 0 #ffffff66;color:#fff;font-size:12px;font-weight:950;letter-spacing:.01em;cursor:pointer}
          .ac-promo-cta span{font-size:19px;line-height:1}
          .ac-promo-cta:active{transform:translateY(1px);filter:brightness(.95)}
          @media(max-width:380px){.ac-promo{width:calc(100% - 20px);border-radius:21px}.ac-promo-top{padding:13px 14px}.ac-promo-content{padding:16px 15px}.ac-promo-content h2{max-width:100%;font-size:19px}.ac-promo-footer{align-items:stretch;flex-direction:column}.ac-promo-cta{width:100%}}
          </style>"""
          if '.ac-promo{' not in h:
              h = h.replace('</head>', promo_css + '\n</head>', 1)
          # Recompute the body insertion point after adding head CSS; otherwise the
          # previous byte offset can land inside the style block and corrupt the page.
          body_match = __import__('re').search(r'<body\b[^>]*>', h, flags=__import__('re').I)
          if not body_match:
              raise SystemExit("FAIL: HTML body insertion point not found after promo CSS")
          insert_at = body_match.end()
          h = h[:insert_at] + promo_card + promo_script + '\n' + h[insert_at:]
          if h.count("const endpoint='https://hckvehpkzwyerkwpdvlz.supabase.co/functions/v1/allconvert-promotions';") != 1:
              raise SystemExit("FAIL: promotion script must exist exactly once in the main page")
          if "b=new Blob([`<!doctype html><html><head><meta charset=\"utf-8\"><title>Converted DOCX</title></head><body>${h}</body></html>`]" not in h:
              raise SystemExit("FAIL: DOCX HTML export template is not intact")
          # Give the isolated file picker a visible, consistent touch target.
          picker_css = '.pick-file-btn{margin-top:14px;min-height:44px;padding:0 20px;border:0;border-radius:12px;background:linear-gradient(135deg,#7768ff,#22cfee);color:#fff;font-weight:800;cursor:pointer}'
          if '.pick-file-btn{' not in h:
              h = h.replace('</style>', picker_css + '</style>', 1)
          # Repair conversion routes that previously produced raw HTML as PDF/text.
          html_helpers = r""" 
          function htmlToText(source){const doc=new DOMParser().parseFromString(String(source),"text/html");doc.querySelectorAll("script,style,iframe,object,embed").forEach(x=>x.remove());return (doc.body.innerText||doc.body.textContent||"").replace(/\n{3,}/g,"\n\n").trim()}
          async function htmlToPDF(source){const doc=new DOMParser().parseFromString(String(source),"text/html");doc.querySelectorAll("script,iframe,object,embed,form,base").forEach(x=>x.remove());const root=document.createElement("div");Object.assign(root.style,{position:"fixed",left:"-100000px",top:"0",width:"794px",minHeight:"1123px",padding:"45px",boxSizing:"border-box",background:"#fff",color:"#111",fontFamily:"Arial,sans-serif",fontSize:"16px",lineHeight:"1.5"});const styles=[...doc.head.querySelectorAll("style")].map(x=>x.textContent).join("\n");root.innerHTML=(styles?"<style>"+styles+"</style>":"")+(doc.body.innerHTML||"");root.querySelectorAll("*").forEach(el=>[...el.attributes].forEach(a=>{if(/^on/i.test(a.name)||((a.name==="href"||a.name==="src")&&/^\s*javascript:/i.test(a.value)))el.removeAttribute(a.name)}));document.body.appendChild(root);try{const canvas=await html2canvas(root,{scale:1.5,backgroundColor:"#fff",useCORS:false,logging:false}),{jsPDF}=window.jspdf,p=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"}),pw=p.internal.pageSize.getWidth(),ph=p.internal.pageSize.getHeight(),margin=8,usable=pw-2*margin,pixelsPerMm=canvas.width/usable,pagePixels=Math.floor((ph-2*margin)*pixelsPerMm);let y=0;while(y<canvas.height){const height=Math.min(pagePixels,canvas.height-y),slice=document.createElement("canvas");slice.width=canvas.width;slice.height=height;slice.getContext("2d").drawImage(canvas,0,y,canvas.width,height,0,0,canvas.width,height);if(y>0)p.addPage();p.addImage(slice.toDataURL("image/jpeg",.92),"JPEG",margin,margin,usable,height/pixelsPerMm,undefined,"FAST");y+=height}return p.output("blob")}finally{root.remove()}}
          async function extractPDFText(file){const pdfjs=await getPdfJs(),pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,max=Math.min(pdf.numPages,50),parts=[];for(let n=1;n<=max;n++){setStatus("Membaca PDF: muka surat "+n+"/"+pdf.numPages+"…");const page=await pdf.getPage(n),content=await page.getTextContent(),selectable=(content.items||[]).map(x=>x.str||"").join(" ").trim();if(selectable){parts.push("--- Muka surat "+n+" ---\n"+selectable)}else{const base=page.getViewport({scale:1}),scale=Math.min(2.2,1800/base.width),vp=page.getViewport({scale}),canvas=document.createElement("canvas");canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;const scanned=await ocrImage(canvas);parts.push("--- Muka surat "+n+" ---\n"+scanned.trim())}}if(pdf.numPages>max)parts.push("[Bacaan dihentikan selepas "+max+" muka surat.]");return parts.join("\n\n").trim()}
          """
          if "async function htmlToPDF(" not in h:
              helper_anchor = "async function extractZip(f){"
              if helper_anchor not in h: raise SystemExit("FAIL: conversion helper insertion point missing")
              h = h.replace(helper_anchor, html_helpers + "\n" + helper_anchor, 1)
          if 'const text=await ocrPDF(currentFile);' in h:
              h = h.replace('const text=await ocrPDF(currentFile);', 'const text=await extractPDFText(currentFile);', 1)
          else: raise SystemExit("FAIL: PDF-to-text conversion route not found")
          if 'if(to==="pdf")b=textToPDF(t);else if(to==="html"){' in h:
              h = h.replace('if(to==="pdf")b=textToPDF(t);else if(to==="html"){', 'if(to==="pdf")b=from==="html"?await htmlToPDF(t):textToPDF(t);else if(to==="html"){', 1)
          else: raise SystemExit("FAIL: HTML-to-PDF conversion route not found")
          if 'else{b=new Blob([t],{type:"text/plain"});showText(t)}}else if(from==="pdf"){' in h:
              h = h.replace('else{b=new Blob([t],{type:"text/plain"});showText(t)}}else if(from==="pdf"){', 'else{const output=from==="html"?htmlToText(t):t;b=new Blob([output],{type:"text/plain"});showText(output)}}else if(from==="pdf"){', 1)
          else: raise SystemExit("FAIL: HTML-to-TXT conversion route not found")
          old_download = 'function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.rel="noopener";a.style.display="none";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}'
          new_download = 'async function downloadBlob(blob,name){if(window.AndroidBridge?.download){try{const encoded=await blobB64(blob);window.AndroidBridge.download(name,blob.type||"application/octet-stream",encoded);return true}catch(e){console.error("Native ZIP download failed",e)}}const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.rel="noopener";a.style.display="none";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);return true}'
          if old_download in h: h = h.replace(old_download,new_download,1)
          else: raise SystemExit("FAIL: ZIP download helper not found")
          p.write_text(h, encoding="utf-8")
          PY
          grep -q 'recordConverted' app/src/main/assets/index.html

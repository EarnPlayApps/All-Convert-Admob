name: All Convert - Build APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, fix/app-open-cooldown-5min ]

concurrency:
  group: all-convert-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore All Convert HTML asset
        working-directory: allconvert_native
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat .build/index.gz.b64.aa .build/index.gz.b64.ab .build/index.gz.b64.ac .build/index.gz.b64.ad > /tmp/index.gz.b64
          tr -cd 'A-Za-z0-9+/=' < /tmp/index.gz.b64 > /tmp/index.clean.b64
          base64 --ignore-garbage -d /tmp/index.clean.b64 > /tmp/index.gz
          gunzip -c /tmp/index.gz > app/src/main/assets/index.html
          sed -i 's/ca-app-pub-9940728659432865~7835018675/ca-app-pub-9940728659432865~2706136459/g; s/ca-app-pub-9940728659432865\/7572128943/ca-app-pub-9940728659432865\/6234492932/g' app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/privacy_policy.html
          test -s app/src/main/assets/terms.html
          grep -q "Dasar Privasi All Convert" app/src/main/assets/privacy_policy.html
          grep -q "Terma Penggunaan All Convert" app/src/main/assets/terms.html
          grep -q "showLegalPage" app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q "settingsEntry" app/src/main/res/layout/activity_main.xml
          grep -q "historyEntry" app/src/main/res/layout/activity_main.xml
          grep -q "allconvert_pro_monthly" app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q "recordHistory" app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q "recordConverted" app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q "showHistoryDialog" app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q "allconvert-history" app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q "SUPABASE_PUBLISHABLE_KEY" app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q "com.android.billingclient:billing:6.2.1" app/build.gradle
          ACTUAL=$(wc -c < app/src/main/assets/index.html)
          test "$ACTUAL" -ge 30000
          sed -i 's|#admobBanner{width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;overflow:hidden;border-radius:12px;background:rgba(255,255,255,.025)}|#admobBanner{display:none!important;min-height:0!important;margin:0!important}|' app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/index.html")
          h = p.read_text(encoding="utf-8")
          old = '<label class="drop" id="drop" for="fileInput"><div class="drop-icon">📁</div><div class="drop-title">Tap untuk pilih fail</div><div class="drop-sub">atau drag &amp; drop • maksimum 100 MB</div><input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp,.avif,.bmp,.gif,.docx,.txt,.md,.html,.csv,.json,.pdf,.zip,*/*"></label>'
          new = '<div class="drop" id="drop"><div class="drop-icon">📁</div><div class="drop-title">Pilih fail untuk mula</div><div class="drop-sub">atau drag &amp; drop • maksimum 100 MB</div><button type="button" class="pick-file-btn" id="pickFileBtn">Tap untuk pilih fail</button><input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp,.avif,.bmp,.gif,.docx,.txt,.md,.html,.csv,.json,.pdf,.zip,*/*" style="display:none"></div>'
          if old not in h:
              raise SystemExit("FAIL: original file picker markup not found")
          h = h.replace(old, new, 1)
          css_anchor = '.drop{margin-top:18px;'
          if css_anchor not in h:
              raise SystemExit("FAIL: drop CSS anchor not found")
          h = h.replace(css_anchor, '.drop{position:relative;margin-top:18px;', 1)
          button_css = '.pick-file-btn{margin-top:14px;min-height:48px;padding:0 24px;border:1px solid rgba(255,255,255,.7);border-radius:15px;color:#fff;font-weight:800;background:linear-gradient(135deg,#8f82ff 0%,#655bdf 48%,#20cfee 100%);box-shadow:0 10px 24px rgba(73,102,255,.25),inset 0 1px 0 rgba(255,255,255,.42);cursor:pointer}.pick-file-btn:active{transform:scale(.98)}'
          glossy_css = r"""
          :root{color-scheme:dark;--ac-ink:#eef2ff;--ac-glass:rgba(16,24,52,.82);--ac-purple:#7768ff;--ac-cyan:#22cfee}
          *{-webkit-tap-highlight-color:transparent}
          body{color:var(--ac-ink)!important;background:radial-gradient(ellipse at 12% 0%,rgba(119,104,255,.20),transparent 42%),radial-gradient(ellipse at 100% 24%,rgba(34,207,238,.13),transparent 38%),linear-gradient(155deg,#070b18 0%,#0b1024 56%,#081725 100%)!important}
          .header{background:linear-gradient(145deg,rgba(20,29,62,.94),rgba(9,20,40,.88))!important;border:1px solid rgba(130,150,220,.18)!important;border-radius:18px;padding:10px 12px;box-shadow:0 10px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.12)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
          .banner{border:1px solid rgba(119,140,255,.28)!important;box-shadow:0 18px 44px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.13)!important}
          .hero,.card,.result,.home-plan,.home-intro{border:1px solid rgba(143,162,225,.22)!important;background:linear-gradient(145deg,rgba(23,33,69,.94),rgba(10,18,39,.92))!important;box-shadow:0 16px 38px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.09)!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
          .drop{border:1.5px dashed rgba(119,104,255,.62)!important;border-radius:24px!important;background:linear-gradient(145deg,rgba(34,44,89,.42),rgba(10,22,42,.62))!important;box-shadow:0 16px 38px rgba(32,76,170,.16),inset 0 1px 0 rgba(255,255,255,.08)!important}
          .drop-title{color:#f2f4ff!important;font-weight:800!important}.drop-sub{color:#9ca9c8!important}
          button,.btn,input[type=button],input[type=submit]{border-radius:14px!important;font-weight:700!important;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}
          .pick-file-btn,.convert-btn,#downloadBtn,.home-primary,.home-pro-btn{color:#fff!important;border:1px solid rgba(255,255,255,.28)!important;background:linear-gradient(135deg,#8f82ff 0%,#655bdf 48%,#20cfee 100%)!important;box-shadow:0 10px 24px rgba(73,102,255,.28),inset 0 1px 0 rgba(255,255,255,.34)!important}
          .result-buttons button{background:linear-gradient(145deg,#202b55,#111b38)!important;border:1px solid rgba(136,157,225,.26)!important;color:#f5f7ff!important;box-shadow:0 7px 18px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.08)!important}
          input:not([type=file]),select,textarea{border:1px solid rgba(132,151,213,.3)!important;border-radius:13px!important;background:linear-gradient(145deg,#172244,#101a35)!important;color:#f4f6ff!important;box-shadow:inset 0 1px 2px rgba(0,0,0,.2),0 4px 12px rgba(0,0,0,.12)!important}
          .home-page{padding-bottom:10px}.convert-page{display:none}
          .home-title{font-size:23px;font-weight:900;line-height:1.2;margin:0 0 7px;color:#fff}
          .home-sub{font-size:13px;line-height:1.55;color:#aab5d0;margin:0}
          .home-intro{border-radius:22px;padding:18px;margin:14px 0}
          .home-plans{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:13px}
          .home-plan{border-radius:19px;padding:14px;min-width:0}
          .home-plan h3{font-size:15px;margin:0 0 5px;color:#fff}.home-plan .plan-price{font-size:22px;font-weight:900;margin:4px 0 9px}
          .home-plan p{font-size:11px;line-height:1.55;color:#aab5d0;margin:4px 0}
          .home-plan.pro{border-color:rgba(119,104,255,.62)!important;box-shadow:0 12px 30px rgba(90,90,255,.16),inset 0 1px 0 rgba(255,255,255,.12)!important}
          .home-primary,.home-pro-btn{width:100%;min-height:45px;margin-top:10px}
          .home-free-btn{width:100%;min-height:45px;margin-top:10px;color:#e7eaff!important;background:linear-gradient(145deg,#26345f,#172442)!important;border:1px solid rgba(143,162,225,.28)!important}
          .home-note{font-size:10px;color:#8e9ab7;line-height:1.5;text-align:center;margin:12px 4px}
          .home-nav{position:fixed;z-index:999;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px;border:1px solid rgba(139,158,220,.25);border-radius:19px;background:linear-gradient(145deg,rgba(24,34,72,.97),rgba(8,18,37,.97));box-shadow:0 12px 32px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(18px)}
          .home-nav button{min-height:43px;border:0!important;background:transparent!important;color:#9eabc9!important;font-size:10px;padding:4px 2px}
          .home-nav button.active{color:#fff!important;background:linear-gradient(135deg,rgba(119,104,255,.38),rgba(34,207,238,.2))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)!important}
          .app{padding-bottom:82px!important}
          @media(max-width:380px){.home-plans{grid-template-columns:1fr}.home-plan{padding:12px}.home-title{font-size:21px}}
          """
          h = h.replace('</style>', button_css + glossy_css + '</style>', 1)
          # Separate the first screen from the actual conversion workspace.
          header_end = '</header>'
          if header_end not in h: raise SystemExit("FAIL: app header anchor missing")
          home_open = '''
          <section id="homePage" class="home-page">
          '''
          h = h.replace(header_end, header_end + home_open, 1)
          banner_start = h.find('<section class="banner">')
          banner_end = h.find('</section>', banner_start)
          if banner_start < 0 or banner_end < 0: raise SystemExit("FAIL: home banner not found")
          banner_end += len('</section>')
          home_cards = '''
          <div class="home-intro">
            <h1 class="home-title">Tukar fail dengan mudah.</h1>
            <p class="home-sub">Satu tempat untuk menukar dokumen, imej dan format fail harian. Pilih Free untuk mula atau lihat manfaat All Convert Pro.</p>
            <button type="button" class="home-primary" id="homeStartBtn">Mula Convert Percuma</button>
          </div>
          <h2 style="font-size:17px;margin:18px 2px 8px;color:#fff">Pilih cara penggunaan</h2>
          <div class="home-plans">
            <div class="home-plan">
              <h3>FREE</h3><div class="plan-price">RM0</div>
              <p>• Fungsi conversion asas</p><p>• Iklan dipaparkan</p><p>• Tiada History</p>
              <button type="button" class="home-free-btn" id="homeFreeBtn">Gunakan Free</button>
            </div>
            <div class="home-plan pro">
              <h3>ALL CONVERT PRO</h3><div class="plan-price">PRO</div>
              <p>• Pengalaman tanpa iklan</p><p>• History sehingga 50 fail / 200 MB</p><p>• Pulihkan pembelian Google Play</p>
              <button type="button" class="home-pro-btn" id="homeProBtn">Lihat Pelan Pro</button>
            </div>
          </div>
          <p class="home-note">Harga bulanan, tahunan dan seumur hidup dipaparkan mengikut mata wang akaun Google Play di halaman Pro. History disimpan pada peranti.</p>
          </section>
          <section id="convertPage" class="convert-page">
          '''
          h = h[:banner_end] + home_cards + h[banner_end:]
          convert_anchor = '<section class="hero">'
          if convert_anchor not in h: raise SystemExit("FAIL: conversion workspace anchor missing")
          h = h.replace(convert_anchor, convert_anchor, 1)
          note_end = '</div>\n</div>\n<div class=\"toast\"'
          if note_end not in h: raise SystemExit("FAIL: conversion page closing anchor missing")
          nav = '''
          <nav class="home-nav" aria-label="Navigasi utama">
            <button type="button" id="navHome" class="active">⌂<br>Utama</button>
            <button type="button" id="navConvert">⇄<br>Convert</button>
            <button type="button" id="navPro">✦<br>Pro</button>
            <button type="button" id="navHistory" style="display:none">▤<br>History</button>
            <button type="button" id="navSettings">⚙<br>Tetapan</button>
          </nav>
          '''
          h = h.replace(note_end, '</div>\n</section>\n</div>\n' + nav + '<div class=\"toast\"', 1)
          # Add page switching and native navigation hooks.
          js_nav = '''
          function showPage(page){
            const home=page==='home';
            $("homePage").style.display=home?"block":"none";
            $("convertPage").style.display=home?"none":"block";
            ["navHome","navConvert","navPro","navSettings"].forEach(id=>$(id)?.classList.remove("active"));
            $(home?"navHome":"navConvert")?.classList.add("active");
            if(window.AndroidBridge?.setAdPage)window.AndroidBridge.setAdPage(page);
            window.scrollTo(0,0);
          }
          $("homeStartBtn").addEventListener("click",()=>showPage("convert"));
          $("homeFreeBtn").addEventListener("click",()=>showPage("convert"));
          $("navHome").addEventListener("click",()=>showPage("home"));
          $("navConvert").addEventListener("click",()=>showPage("convert"));
          $("homeProBtn").addEventListener("click",()=>window.AndroidBridge?.openPro?.());
          $("navPro").addEventListener("click",()=>window.AndroidBridge?.openPro?.());
          $("navSettings").addEventListener("click",()=>window.AndroidBridge?.openSettings?.());
          $("navHistory").addEventListener("click",()=>window.AndroidBridge?.openHistory?.());
          window.__allConvertSetPro=function(enabled){$("navHistory").style.display=enabled?"block":"none"};
          showPage("home");
          '''
          anchor = '$("downloadBtn").onclick=downloadResultFile;'
          if anchor not in h: raise SystemExit("FAIL: page navigation insertion point missing")
          h = h.replace(anchor, js_nav + anchor, 1)
          h = h.replace('window.__allConvertIncoming=function(name,mime,b64){try{', 'window.__allConvertIncoming=function(name,mime,b64){try{showPage("convert");', 1)
          js_anchor = '$("downloadBtn").onclick=downloadResultFile;'
          if js_anchor not in h:
              raise SystemExit("FAIL: file picker event insertion point not found")
          h = h.replace(js_anchor, '$("pickFileBtn").addEventListener("click",e=>{e.preventDefault();e.stopPropagation();$("fileInput").click()});' + js_anchor, 1)
          history_anchor = 'resultBlob=b;resultName=baseName(currentFile.name)+"."+to;'
          if history_anchor not in h:
              raise SystemExit("FAIL: successful conversion History hook not found")
          history_hook = 'resultBlob=b;resultName=baseName(currentFile.name)+"."+to;if(window.AndroidBridge?.recordConverted){if(b.size<=52428800){try{const reader=new FileReader();const encoded=await new Promise((resolve,reject)=>{reader.onload=()=>resolve(String(reader.result).split(",")[1]||"");reader.onerror=()=>reject(reader.error);reader.readAsDataURL(b)});window.AndroidBridge.recordConverted(resultName,b.type||"application/octet-stream",encoded);window.__allConvertHistoryLarge=false}catch(historyError){console.warn("History local save failed",historyError)}}else{window.__allConvertHistoryLarge=true}}'
          h = h.replace(history_anchor, history_hook, 1)
          toast_anchor = 'showToast("✅ Conversion berjaya!",resultName+" sudah siap.");'
          if toast_anchor not in h:
              raise SystemExit("FAIL: successful conversion toast anchor not found")
          toast_replacement = 'showToast("✅ Conversion berjaya!",resultName+" sudah siap."+(window.__allConvertHistoryLarge?" Fail lebih 50 MB tidak masuk History automatik; sila simpan manual.":""));window.__allConvertHistoryLarge=false;'
          h = h.replace(toast_anchor, toast_replacement, 1)
          print("Automatic Pro History hook added after successful conversion")
          if 'recordConverted' not in h:
              raise SystemExit("FAIL: automatic History hook was not inserted")
          p.write_text(h, encoding="utf-8")
          print("File picker isolated to #pickFileBtn")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/index.html")
          h = p.read_text(encoding="utf-8")
          card = """
          <section id="promoAnnouncement" class="home-intro" style="display:none;margin-top:12px;border-color:rgba(230,155,55,.45)!important">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
              <span aria-hidden="true" style="font-size:18px;color:#E99A32">◆</span>
              <strong id="promoEyebrow" style="font-size:12px;letter-spacing:.04em">PENGUMUMAN</strong>
            </div>
            <h2 id="promoTitle" style="font-size:17px;font-weight:850;margin:0 0 6px"></h2>
            <p id="promoMessage" class="home-sub" style="margin:0 0 8px"></p>
            <p id="promoDates" style="font-size:11px;opacity:.78;margin:0"></p>
          </section>
          """
          marker = '<h2 style="font-size:17px;margin:18px 2px 8px;color:#fff">Pilih cara penggunaan</h2>'
          if marker not in h:
              raise SystemExit("FAIL: home plans insertion anchor missing")
          h = h.replace(marker, card + marker, 1)
          script = r"""
          <script>
          (function(){
            const endpoint='https://hckvehpkzwyerkwpdvlz.supabase.co/functions/v1/allconvert-promotions';
            const publicKey='sb_publishable_W1nZcXZSwu3oeKA35iQeJA_AU579wju';
            const box=document.getElementById('promoAnnouncement');
            if(!box)return;
            const fmt=value=>new Intl.DateTimeFormat(navigator.language||'en',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Kuala_Lumpur'}).format(new Date(value));
            fetch(endpoint+'?locale='+encodeURIComponent((navigator.language||'en').split('-')[0]),{headers:{apikey:publicKey,Authorization:'Bearer '+publicKey}})
              .then(r=>{if(!r.ok)throw new Error('promo unavailable');return r.json()})
              .then(data=>{
                const promo=data.active||data.next;
                if(!promo)return;
                const active=!!data.active;
                document.getElementById('promoEyebrow').textContent=active?(data.ending_soon?'PROMO HAMPIR TAMAT':'PROMO SEDANG BERLANGSUNG'):'PROMO AKAN DATANG';
                document.getElementById('promoTitle').textContent=promo.title||'Pengumuman All Convert';
                document.getElementById('promoMessage').textContent=promo.message||'Semak tawaran terkini All Convert Pro.';
                document.getElementById('promoDates').textContent=(active?'Sah sehingga ':'Bermula ')+(active?fmt(promo.ends_at):fmt(promo.starts_at))+' · Waktu Malaysia';
                box.style.display='block';
              })
              .catch(()=>{box.style.display='none'});
          })();
          </script>
          """
          if '</body>' not in h:
              raise SystemExit("FAIL: HTML body closing tag missing")
          h = h.replace('</body>', script + '\n</body>', 1)
          p.write_text(h, encoding="utf-8")
          print("All Convert remote promotion announcement UI inserted")
          PY
          grep -q 'recordConverted' app/src/main/assets/index.html
          grep -q '#admobBanner{display:none!important' app/src/main/assets/index.html
          grep -q 'ALL CONVERT ADMOB LIVE BANNER' app/src/main/assets/index.html
          grep -q 'ca-app-pub-9940728659432865~2706136459' app/src/main/assets/index.html
          grep -q 'ca-app-pub-9940728659432865/6234492932' app/src/main/assets/index.html
          ! grep -q 'ca-app-pub-9940728659432865/7572128943' app/src/main/assets/index.html
          grep -q 'ca-app-pub-9940728659432865~2706136459' app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/6234492932' app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/4102978608' app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/6537570257' app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/5224488586' app/src/main/java/com/allconvert/app/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/1006961841' app/src/main/java/com/allconvert/app/MainActivity.java
          echo "HTML asset and native AdMob IDs verified: $ACTUAL bytes"

      - name: Audit conversion quality engine
        working-directory: allconvert_native
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Canvas export quality calls ==="
          grep -nE 'toDataURL|toBlob|convertToBlob|quality' app/src/main/assets/index.html | head -120 || true
          echo "=== Image conversion libraries / formats ==="
          grep -nEi 'image/(jpeg|webp|avif|png)|\.jpeg|\.jpg|\.webp|\.avif|\.png' app/src/main/assets/index.html | head -160 || true
          echo "=== Conversion APIs ==="
          grep -nEi 'jsPDF|html2canvas|mammoth|pdf|docx|xlsx|csv|zip' app/src/main/assets/index.html | head -160 || true

      - name: Setup Java 17 (Android build JDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.14.6 (compatible with AGP 8.7.3)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.6'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | head -80

      - name: Build release APK (optimized)
        working-directory: allconvert_native
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK output
        working-directory: allconvert_native
        run: |
          test -s app/build/outputs/apk/release/*.apk
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: All-Convert-optimized-APK
          path: allconvert_native/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14


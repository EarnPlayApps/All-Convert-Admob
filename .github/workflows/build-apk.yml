name: All Convert - Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore All Convert HTML asset
        working-directory: allconvert_native
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat .build/index.gz.b64.aa .build/index.gz.b64.ab .build/index.gz.b64.ac .build/index.gz.b64.ad > /tmp/index.gz.b64
          tr -cd 'A-Za-z0-9+/=' < /tmp/index.gz.b64 > /tmp/index.clean.b64
          base64 --ignore-garbage -d /tmp/index.clean.b64 > /tmp/index.gz
          gunzip -c /tmp/index.gz > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          ACTUAL=$(wc -c < app/src/main/assets/index.html)
          test "$ACTUAL" -eq 31327
          grep -q 'ALL CONVERT ADMOB LIVE BANNER' app/src/main/assets/index.html
          grep -q 'ca-app-pub-9940728659432865/7572128943' app/src/main/assets/index.html
          echo "HTML asset restored and verified: $ACTUAL bytes"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | head -80

      - name: Build debug APK
        working-directory: allconvert_native
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        working-directory: allconvert_native
        run: |
          test -s app/build/outputs/apk/debug/*.apk
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: All-Convert-debug-APK
          path: allconvert_native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
